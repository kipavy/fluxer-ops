# voice/compose.yml - LiveKit alone, for a host that keeps only the voice server
# while the rest of the instance runs elsewhere (README, "Voice on a separate
# host"). Start it only once the main stack on this host is stopped: both bind the
# LiveKit ports, and proxy takes 80/443 from the stack's edge.
#
#   docker compose --env-file voice/.env -f voice/compose.yml up -d
#
# livekit is the stack's own service (rexctl's generated compose) minus what ties
# it to the stack: its webhook goes to the instance's public URL instead of
# http://api:8080, and it has no depends_on. Single node: no Redis, as in the stack.
# proxy terminates TLS for VOICE_DOMAIN (signalling and LiveKit's control API, both
# on 7880); media goes straight to 7881/tcp and 7882/udp.
name: fluxer-voice

services:
  livekit:
    image: ${LIVEKIT_IMAGE}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512mb
    environment:
      GOMEMLIMIT: 435MiB
      LIVEKIT_KEYS: ${LIVEKIT_KEYS}
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
          node_ip: ""
          stun_servers:
            - stun.l.google.com:19302
            - stun1.l.google.com:19302
          turn_servers: []
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - ${LIVEKIT_WEBHOOK_URL}
    ports:
      - "7881:7881"
      - "7882:7882/udp"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880/"]
      interval: 60s
      start_period: 60s
      start_interval: 1s
      retries: 10

  proxy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    environment:
      VOICE_DOMAIN: ${VOICE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - livekit

volumes:
  caddy-data:
